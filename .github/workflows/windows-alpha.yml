name: Windows alpha
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - name: Install the tarball and check public discovery over stdio
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'installed-contract'
          $tarball = (Get-ChildItem *.tgz -File).FullName
          npm install --prefix $stage --ignore-scripts $tarball
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node "$stage/node_modules/@sarutobi-sasuke/reaper-mcp/scripts/contract-check.mjs"
      - name: Upgrade an existing alpha.6 workspace in place
        if: matrix.node == 22
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'upgrade-app'
          $workspace = Join-Path $env:RUNNER_TEMP 'upgrade-workspace'
          npm install --prefix $prefix --ignore-scripts '@sarutobi-sasuke/reaper-mcp@0.1.0-alpha.6'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/upgrade-check.mjs seed $prefix $workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix $prefix --ignore-scripts (Get-ChildItem *.tgz -File).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/upgrade-check.mjs verify $prefix $workspace
      - uses: actions/upload-artifact@v4
        with:
          name: windows-alpha-node-${{ matrix.node }}
          path: '*.tgz'
          if-no-files-found: error

  native-workflows:
    needs: package
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the official REAPER 7.86 evaluation on the disposable runner
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'reaper786_x64-install.exe'
          Invoke-WebRequest 'https://www.reaper.fm/files/7.x/reaper786_x64-install.exe' -OutFile $installer -MaximumRetryCount 2
          # Published x64 checksum in Microsoft's Cockos.REAPER 7.86 WinGet manifest.
          if ((Get-FileHash $installer).Hash -ne '02AF50CC5C5417B92EFDE1E8FBDB4F37564E8545C3DA409782ECBE7C0E90DF76') { throw 'Unexpected REAPER installer checksum' }
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          # WinGet lists 1223 as a successful installer exit. Verify the executable as well.
          if ($install.ExitCode -notin 0,1223) { throw "Installer exited $($install.ExitCode)" }
          $binary = Get-Item 'C:/Program Files/REAPER (x64)/reaper.exe'
          if ($binary.VersionInfo.ProductVersion -notlike '7.86*') { throw 'REAPER 7.86 was not installed' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-alpha-node-22
          path: candidate-package
      - name: Install the tested tarball and verify native workflows
        shell: pwsh
        env:
          REAPER_MCP_RUN_RELEASE_CHECK: 'true'
          REAPER_MCP_RUN_LIVE_CHECK: 'true'
          REAPER_MCP_RUN_RENDER: 'true'
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'reaper-acceptance'
          New-Item -ItemType Directory $stage | Out-Null
          $tarball = (Get-ChildItem candidate-package/*.tgz -File).FullName
          npm install --prefix $stage --ignore-scripts $tarball
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $check = Join-Path $stage 'node_modules/@sarutobi-sasuke/reaper-mcp/scripts/editing-check.mjs'
          $env:TEMP = $stage
          $env:TMP = $stage
          foreach ($script in @("alpha-check.mjs", "batch-check.mjs", "lifecycle-check.mjs")) {
            node (Join-Path (Split-Path $check) $script)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          node (Join-Path (Split-Path $check) "windows-release-check.mjs")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node $check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node $check --routing
          exit $LASTEXITCODE
      - name: Check out the pinned reference server for the optional comparison
        if: contains(github.event.pull_request.labels.*.name, 'benchmark-sidechain')
        uses: actions/checkout@v4
        with:
          repository: TwelveTake-Studios/reaper-mcp
          ref: 3718e0158db96ca59aa9b5c982417770368bde0e
          path: reference-server
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: contains(github.event.pull_request.labels.*.name, 'benchmark-sidechain')
        with:
          python-version: '3.12'
      - name: Compare sidechain audio on the same machine and fixture
        if: contains(github.event.pull_request.labels.*.name, 'benchmark-sidechain')
        shell: pwsh
        run: |
          python -m pip install -r reference-server/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report = Get-Item "$env:RUNNER_TEMP/reaper-acceptance/reaper-release-*/routing-check.json"
          python scripts/benchmark-sidechain.py $report.FullName reference-server
          exit $LASTEXITCODE
      - name: Retain measurements and listening copies
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-workflow-evidence
          path: |
            ${{ runner.temp }}/reaper-acceptance/reaper-release-*/release-check.json
            ${{ runner.temp }}/reaper-acceptance/reaper-release-*/routing-check.json
            ${{ runner.temp }}/reaper-acceptance/reaper-release-*/peer-check.json
            ${{ runner.temp }}/reaper-acceptance/reaper-release-*/audition-*/A.wav
            ${{ runner.temp }}/reaper-acceptance/reaper-release-*/audition-*/B.wav
            ${{ runner.temp }}/reaper-acceptance/reaper-release-*/audition-*/audition.rpp
          if-no-files-found: warn
