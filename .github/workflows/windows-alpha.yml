name: Windows alpha
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: windows-alpha-node-${{ matrix.node }}
          path: '*.tgz'
          if-no-files-found: error
